name: deploy

# Test on GitHub's runners, then rebuild + restart on the always-on box (self-hosted runner).
#
# SECURITY: the deploy job runs on the machine that holds the broker keys.
#   - Keep this repository PRIVATE. That is the real control: in a public repo, any pull
#     request could add its own workflow targeting the self-hosted runner.
#   - Never add a `pull_request` trigger here: that would let a PR run code on the box.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: ci-not-a-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest tests -q

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test -- --run
      - run: npm run build

  deploy:
    needs: [test-backend, test-frontend]
    # A manual run can be started from any branch; only main is ever deployed to the box.
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, profitpilot]
    # How the box runs the app — repo variable PROFITPILOT_DEPLOY:
    #   (unset) / "windows" → native Windows install (deploy/windows, no Docker) — the default
    #   "docker"            → docker/docker-compose.host.yml
    env:
      PROFITPILOT_APP_DIR: ${{ vars.PROFITPILOT_APP_DIR || 'C:\Users\Lenovo\Documents\_WORKKKKK\ProfitPilot' }}  # windows: the clone on the box
      PROFITPILOT_ENV_FILE: ${{ vars.PROFITPILOT_ENV_FILE }}      # docker only
      PROFITPILOT_BIND: ${{ vars.PROFITPILOT_BIND }}              # docker only
      PROFITPILOT_BACKUP_DIR: ${{ vars.PROFITPILOT_BACKUP_DIR }}  # docker only
    steps:
      - uses: actions/checkout@v4

      - name: Update the native Windows install
        if: vars.PROFITPILOT_DEPLOY != 'docker'
        shell: powershell
        run: |
          & .\deploy\windows\update.ps1 -AppDir $env:PROFITPILOT_APP_DIR -Source $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and restart (Docker)
        if: vars.PROFITPILOT_DEPLOY == 'docker'
        run: docker compose -f docker/docker-compose.host.yml up -d --build --wait
      - name: Remove superseded images (Docker, this project's only)
        if: vars.PROFITPILOT_DEPLOY == 'docker'
        run: docker image prune -f --filter label=com.docker.compose.project=profitpilot
